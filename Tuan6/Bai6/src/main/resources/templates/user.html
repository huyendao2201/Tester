<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f172a;
            color: #e5e7eb;
        }
        .sidebar {
            height: 100vh;
            background-color: #020617;
        }
        .sidebar a {
            color: #cbd5f5;
            text-decoration: none;
            display: block;
            padding: 10px 15px;
        }
        .sidebar a:hover {
            background-color: #1e293b;
        }
        .card {
            background-color: #020617;
            border: none;
        }
        .form-control, .form-select {
            background-color: #020617;
            color: #e5e7eb;
            border: 1px solid #334155;
        }
        .form-control::placeholder {
            color: #64748b;
        }
        table {
            color: #e5e7eb;
        }
        th {
            color: #93c5fd;
        }
    </style>
</head>

<body>
<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-2 sidebar p-3">
            <h4 class="text-info mb-4">Hello World</h4>
            <a href="#"><i class="fa fa-home"></i> Home</a>
            <a href="#"><i class="fa fa-user"></i> User Management</a>
            <a href="#"><i class="fa fa-sign-out-alt"></i> Logout</a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-10 p-4">
            <h3 class="text-info mb-4">USER MANAGEMENT</h3>

            <div class="row">
                <!-- FORM -->
                <div class="col-md-5">
                    <div class="card p-3">
                        <h5 class="text-warning mb-3">USER EDITION</h5>

                        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" th:field="*{username}" class="form-control" placeholder="Username">
                            </div>

                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Password">
                            </div>

                            <div class="mb-3">
                                <label>Full name</label>
                                <input type="text" th:field="*{fullname}" class="form-control" placeholder="Full name">
                            </div>

                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="Email">
                            </div>

                            <div class="mb-3">
                                <label>Role</label>
                                <select th:field="*{role}" class="form-select">
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="USER">USER</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Status</label>
                                <select th:field="*{status}" class="form-select">
                                    <option value="true">Active</option>
                                    <option value="false">Inactive</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-primary"><i class="fa fa-plus"></i> Create</button>
                                <button class="btn btn-success"><i class="fa fa-save"></i> Update</button>
                                <a href="/admin/users" class="btn btn-warning"><i class="fa fa-rotate"></i> Reset</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- USER LIST -->
                <div class="col-md-7">
                    <div class="card p-3">
                        <h5 class="text-warning mb-3">USER LIST</h5>

                        <table class="table table-dark table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Fullname</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}"></td>
                                <td th:text="${u.username}"></td>
                                <td th:text="${u.fullname}"></td>
                                <td th:text="${u.email}"></td>
                                <td th:text="${u.role}"></td>
                                <td>
                                    <span th:text="${u.status ? 'Active' : 'Inactive'}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/users/edit/{id}(id=${u.id})}"
                                       class="btn btn-sm btn-info">
                                        <i class="fa fa-edit"></i>
                                    </a>
                                    <a th:href="@{/admin/users/delete/{id}(id=${u.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Delete this user?')">
                                        <i class="fa fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
